spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/elearning
    username: elearning
    password: elearning123
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8080

jwt:
  secret: mySecretKeyForElearningAppThatIsLongEnoughForHS256Algorithm1234567890
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173,http://localhost:4173
