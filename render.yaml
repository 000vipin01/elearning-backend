services:
  - type: web
    name: elearning-backend
    runtime: java
    plan: free
    buildCommand: mvn package -DskipTests
    startCommand: java -jar target/elearning-backend-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elearning-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: elearning-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: elearning-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://elearning-frontend.onrender.com

databases:
  - name: elearning-db
    plan: free
    databaseName: elearning
    user: elearning
