version: '3.8'

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: elearning
      MARIADB_USER: elearning
      MARIADB_PASSWORD: elearning123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/elearning
      SPRING_DATASOURCE_USERNAME: elearning
      SPRING_DATASOURCE_PASSWORD: elearning123
      JWT_SECRET: mySecretKeyForElearningAppThatIsLongEnoughForHS256Algorithm1234567890
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
